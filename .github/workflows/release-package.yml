name: Package Release

on:
  push:
    branches:
      - main
    paths:
      - package.json
      - package-lock.json
      - README.md
      - LICENSE
      - src/**
      - test/**
      - docs/**
      - bootstrap/**
      - scripts/package-release.ps1
      - '*.cmd'
      - '*.ps1'
      - config.example.json
      - .github/workflows/release-package.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  package-release:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install dependencies
        run: npm ci

      - name: Run tests
        run: npm test

      - name: Validate source
        run: npm run validate

      - name: Validate maintenance and ChatGPT wizard
        shell: powershell
        run: |
          foreach ($script in @('.\Windows-Coding-Agent.ps1','.\Toolchain.ps1','.\Install-Dependencies.ps1','.\Update.ps1','.\bootstrap\launch.ps1')) {
            $errors = $null
            [System.Management.Automation.Language.Parser]::ParseFile((Resolve-Path $script), [ref]$null, [ref]$errors) | Out-Null
            if ($errors.Count -gt 0) { $errors | ForEach-Object { Write-Error "$script : $($_.Message)" }; exit 1 }
          }
          $homeAssignments = foreach ($file in (& git ls-files '*.ps1')) {
            Select-String -LiteralPath $file -Pattern '^\s*\$home\s*='
          }
          if ($homeAssignments) {
            $homeAssignments | ForEach-Object { Write-Error "Reserved PowerShell automatic variable assignment: $($_.Path):$($_.LineNumber): $($_.Line)" }
            throw 'Do not assign to $HOME (PowerShell variables are case-insensitive and HOME is read-only).'
          }
          powershell -NoProfile -ExecutionPolicy Bypass -Command ". .\Toolchain.ps1; Invoke-WcaToolchainSelfTest"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          powershell -NoProfile -ExecutionPolicy Bypass -File .\Install-Dependencies.ps1 -SelfTest
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          powershell -NoProfile -ExecutionPolicy Bypass -File .\Update.ps1 -SelfTest
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          powershell -NoProfile -ExecutionPolicy Bypass -File .\Windows-Coding-Agent.ps1 -SelfTest
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          powershell -NoProfile -ExecutionPolicy Bypass -File .\Windows-Coding-Agent.ps1 -ShowInstructions -TunnelId tunnel_release_test
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Resolve release version
        shell: pwsh
        run: |
          $version = [string](Get-Content package.json -Raw | ConvertFrom-Json).version
          if ([string]::IsNullOrWhiteSpace($version)) { throw 'package.json version is empty.' }
          "VERSION=$version" >> $env:GITHUB_ENV
          "TAG=v$version" >> $env:GITHUB_ENV
          "ZIP=dist/Windows-Coding-Agent-v$version.zip" >> $env:GITHUB_ENV
          "SHA=dist/Windows-Coding-Agent-v$version.zip.sha256" >> $env:GITHUB_ENV

      - name: Check for existing release
        id: release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release view $env:TAG --repo $env:GITHUB_REPOSITORY *> $null
          if ($LASTEXITCODE -eq 0) {
            "exists=true" >> $env:GITHUB_OUTPUT
            Write-Host "Release $env:TAG already exists; leaving it immutable."
          } else {
            "exists=false" >> $env:GITHUB_OUTPUT
            exit 0
          }

      - name: Build ZIP package
        if: steps.release.outputs.exists != 'true'
        shell: pwsh
        run: powershell -NoProfile -ExecutionPolicy Bypass -File scripts/package-release.ps1 -OutputDirectory dist -Commit $env:GITHUB_SHA

      - name: Verify release ZIP including v0.1.9 upgrade bridge
        if: steps.release.outputs.exists != 'true'
        shell: powershell
        run: |
          powershell -NoProfile -ExecutionPolicy Bypass -File .\scripts\verify-release-package.ps1 -ZipPath $env:ZIP -LegacyV019
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Create GitHub release
        if: steps.release.outputs.exists != 'true'
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          @"
          Windows Coding Agent v$env:VERSION

          Download Windows-Coding-Agent-v$env:VERSION.zip, extract it, and run Setup.cmd.

          Setup can install or repair required dependencies and creates a versioned managed installation under the current Windows user's .windows-coding-agent directory. Stable launchers and a stable MCP bootstrap prevent release-folder moves from breaking an existing tunnel profile.

          The ChatGPT wizard can self-heal stale tool paths and tunnel profiles, securely remember the runtime credential, detect Windows Application Control blocks, and provide local dependency/update/rollback maintenance. Updates are downloaded from GitHub releases, SHA-256 verified, tested, and only then activated.

          The .sha256 asset contains the SHA-256 checksum for verifying the ZIP.

          This package was built from commit $env:GITHUB_SHA after tests, source validation, maintenance self-tests, and ChatGPT wizard smoke checks passed on the Windows runner.
          "@ | Set-Content release-notes.md -Encoding utf8

          gh release create $env:TAG $env:ZIP $env:SHA `
            --repo $env:GITHUB_REPOSITORY `
            --target $env:GITHUB_SHA `
            --title "Windows Coding Agent v$env:VERSION" `
            --notes-file release-notes.md
