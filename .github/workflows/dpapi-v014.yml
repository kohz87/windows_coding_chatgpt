name: Build v0.1.4 DPAPI credential update

on:
  push:
    branches:
      - work/dpapi-v0.1.4

permissions:
  contents: write

jobs:
  patch-test-commit:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: work/dpapi-v0.1.4
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Apply DPAPI credential update
        shell: powershell
        run: .\.github\scripts\apply-dpapi-v014.ps1
      - name: Install dependencies
        run: npm install
      - name: Run tests and validation
        shell: powershell
        run: |
          npm test
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          npm run validate
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          git diff --check
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Validate DPAPI wizard behavior
        shell: powershell
        run: |
          $errors = $null
          [System.Management.Automation.Language.Parser]::ParseFile((Resolve-Path '.\Connect-ChatGPT.ps1'), [ref]$null, [ref]$errors) | Out-Null
          if ($errors.Count -gt 0) { $errors | ForEach-Object { Write-Error $_.Message }; exit 1 }
          powershell -NoProfile -ExecutionPolicy Bypass -File .\Connect-ChatGPT.ps1 -SelfTest
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $source = Get-Content .\Connect-ChatGPT.ps1 -Raw
          foreach ($needle in @('ProtectedData]::Protect', 'DataProtectionScope]::CurrentUser', 'tunnel-runtime-key.dpapi', 'Save securely for this Windows user', 'Forget saved credential')) {
            if (-not $source.Contains($needle)) { throw "Missing expected DPAPI implementation marker: $needle" }
          }
      - name: Build release package
        run: npm run package
      - name: Commit tested update to branch
        shell: powershell
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add Connect-ChatGPT.ps1 README.md docs/CHATGPT.md docs/SECURITY.md docs/INSTALLATION.md package.json package-lock.json
          git diff --cached --check
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          git commit -m "feat: securely remember tunnel credential with DPAPI"
          git push origin HEAD:work/dpapi-v0.1.4
