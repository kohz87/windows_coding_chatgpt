name: Repair DPAPI patch output formatting

on:
  push:
    branches:
      - work/dpapi-v0.1.4

permissions:
  contents: write

jobs:
  repair:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: work/dpapi-v0.1.4
          fetch-depth: 0
      - name: Normalize generated file endings in patch script
        shell: powershell
        run: |
          $path = '.github/scripts/apply-dpapi-v014.ps1'
          $text = Get-Content -LiteralPath $path -Raw
          $marker = 'npm version 0.1.4 --no-git-tag-version'
          $needle = '$filesToNormalize = @(''Connect-ChatGPT.ps1'', ''README.md'', ''docs/CHATGPT.md'', ''docs/SECURITY.md'', ''docs/INSTALLATION.md'')'
          if ($text.Contains($needle)) {
            Write-Host 'Patch output normalizer already present.'
            exit 0
          }
          if (-not $text.Contains($marker)) { throw 'Version bump marker not found.' }
          $block = @'
$filesToNormalize = @('Connect-ChatGPT.ps1', 'README.md', 'docs/CHATGPT.md', 'docs/SECURITY.md', 'docs/INSTALLATION.md')
foreach ($fileToNormalize in $filesToNormalize) {
  $normalizedContent = Get-Content -LiteralPath $fileToNormalize -Raw
  $normalizedContent = $normalizedContent.TrimEnd("`r", "`n") + "`n"
  [IO.File]::WriteAllText((Resolve-Path $fileToNormalize), $normalizedContent, [Text.UTF8Encoding]::new($false))
}

'@
          $text = $text.Replace($marker, $block + $marker)
          $clean = $text.TrimEnd("`r", "`n") + "`n"
          [IO.File]::WriteAllText((Resolve-Path $path), $clean, [Text.UTF8Encoding]::new($false))
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add $path
          git diff --cached --check
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          git commit -m "fix: normalize DPAPI patch output endings"
          git push origin HEAD:work/dpapi-v0.1.4
