name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install
      - name: Test remote parser
        run: node --test --test-name-pattern="GitHub remote parser" test/core.test.js
      - name: Test path security
        run: node --test --test-name-pattern="relative-path guard" test/core.test.js
      - name: Test config persistence
        run: node --test --test-name-pattern="configuration persists" test/core.test.js
      - name: Test local-only worktree
        run: node --test --test-name-pattern="authorized local-only" test/core.test.js
      - run: npm run validate
